name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Typecheck, Test & Build Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loadshedding_db?schema=public"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loadshedding_db?schema=public"

      - name: Run Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Run Backend Integration Test Suite
        run: npm run test --workspace=apps/api

      - name: Build Backend Production Dist
        run: npm run build --workspace=apps/api
